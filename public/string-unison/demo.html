<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>String unison — celebration demo</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #07060d;
    color: #d9d6e2;
    font: 16px/1.5 -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif;
    display: grid;
    place-items: center;
    -webkit-font-smoothing: antialiased;
  }
  main { text-align: center; padding: 32px; max-width: 34ch; }
  h1 { font-weight: 400; font-size: 20px; margin: 0 0 8px; letter-spacing: .01em; }
  p { margin: 0 0 28px; color: rgba(217,214,226,.6); font-size: 14px; }
  button {
    font: inherit; font-size: 16px; font-weight: 500;
    color: #07060d; background: #f4c26b;
    border: 0; border-radius: 999px; padding: 14px 28px;
    cursor: pointer; transition: transform .12s ease, background .12s ease;
  }
  button:hover { background: #f8d08a; }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 2px solid #f4c26b; outline-offset: 4px; }
  label { display: block; margin-top: 22px; font-size: 13px; color: rgba(217,214,226,.5); }
  input[type=range] { width: 160px; vertical-align: middle; accent-color: #f4c26b; }
</style>
</head>
<body>
<main>
  <h1>Batch of exercises done</h1>
  <p>Plays the celebration full screen. Tap during the build to skip ahead; tap the unified wave to dismiss.</p>
  <button id="go">Play celebration</button>
  <label>Speed <input id="speed" type="range" min="0.6" max="2" step="0.1" value="1"> <span id="speedv">1.0×</span></label>
</main>

<script src="string-unison.js"></script>
<script>
  var go = document.getElementById('go'), speed = document.getElementById('speed'), speedv = document.getElementById('speedv');
  speed.addEventListener('input', function () { speedv.textContent = Number(speed.value).toFixed(1) + '×'; });
  go.addEventListener('click', function () {
    go.disabled = true;
    StringUnison.play({
      accent: '#f4c26b',           // your app's accent
      background: '#07060d',       // your app's background
      label: 'Batch complete',
      sublabel: 'Tap to continue',
      speed: Number(speed.value),
      onDismiss: function () { go.disabled = false; go.focus(); }
    });
  });
</script>
</body>
</html>
